name: Go CI

on:
  pull_request:
    paths:
      - '**.go'
  push:
    paths:
      - '**.go'

env:
  GO_VERSION: 1.23.4

jobs:
  test:
    timeout-minutes: 10
    runs-on: [ubuntu-22.04]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Go ${{ env.GO_VERSION  }} setup
        uses: actions/setup-go@v4
        with:
          go-version: ${{  env.GO_VERSION }}
          cache: true
      - name: cache Go Modules
        id: mod_cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-cache/${{ runner.os }}/${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-cache/${{ runner.os }}/
      - name: cache Go Build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-cache/${{  runnner.os  }}/${{  github.ref  }}/${{  github.sha  }}
          restore-keys: |
            go-build-cache/${{ runner.os }}/${{ github.ref }}/
            go-build-cache/${{ runner.os }}/refs/heads/${{ github.base_ref }}/
            go-build-cache/${{ runner.os }}/refs/heads/main
      - name: Go Modules download
        run: go mod download
      - name: go test
        run: go test ./...
