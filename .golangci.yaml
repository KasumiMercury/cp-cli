linters:
  enable-all: true
  disable:
    - gosmopolitan
    - wsl
    - forbidigo
    - gochecknoglobals
    - depguard
    - godox
    - exportloopref # deprecated
    - gomnd # deprecated
    - execinquery # deprecated

    # on hold
    - gochecknoinits
    - exhaustruct
    - testpackage

linters-settings:
  varnamelen:
    ignore-names:
      - err
      - tt
    ignore-decls:
      - t testing.T
      - e error

issues:
  exclude-rules:
    - path: _test.go
      linters:
        - funlen
